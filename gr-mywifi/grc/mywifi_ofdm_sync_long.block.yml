id: mywifi_ofdm_sync_long
label: OFDM Sync Long
category: Mywifi
flags: [python]
parameters:
  - id: sync_length
    label: Sync Length
    dtype: int
    default: 320
  - id: freq_est
    label: Freq-Offset Est. Samples
    dtype: int
    default: 128
  - id: debug
    label: Debug Print
    dtype: bool
    default: false
inputs:
  - domain: stream
    dtype: complex
    id: in0
    label: in (undelayed)
  - domain: stream
    dtype: complex
    id: in1
    label: in (delayed)
outputs:
  - domain: stream
    dtype: complex
    id: out
templates:
  imports: |-
    from mywifi.ofdm_sync_long import ofdm_sync_long
  make: |-
    ofdm_sync_long(sync_length=${sync_length}, freq_est=${freq_est}, debug=${debug})
file_format: 1
