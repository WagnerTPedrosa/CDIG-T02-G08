id: mywifi_ofdm_sync_short
label: OFDM Sync Short
category: Mywifi
flags: [python]
parameters:
  - id: threshold
    label: Detection Threshold
    dtype: float
    default: 0.8
  - id: max_samples
    label: Max Samples (to copy)
    dtype: int
    default: 1600
  - id: min_plateau
    label: Min Plateau (samples)
    dtype: int
    default: 3
  - id: debug
    label: Debug Print
    dtype: bool
    default: false
inputs:
  - domain: stream
    dtype: complex
    id: in0
    label: in (complex)
  - domain: stream
    dtype: float
    id: in1
    label: in (corr mag)
outputs:
  - domain: stream
    dtype: complex
    id: out
templates:
  imports: |-
    from mywifi.ofdm_sync_short import ofdm_sync_short
  make: |-
    ofdm_sync_short(threshold=${threshold}, max_samples=${max_samples}, min_plateau=${min_plateau}, debug=${debug})
file_format: 1
