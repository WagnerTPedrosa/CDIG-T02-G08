id: mywifi_ofdm_decode_signal
label: OFDM Decode Signal
category: Mywifi
flags: [python]
parameters:
  - id: debug
    label: Debug print
    dtype: bool
    default: false
inputs:
  - domain: stream
    dtype: complex
    id: in
    label: 48-subcarrier symbols
outputs:
  - domain: stream
    dtype: complex
    id: out
    label: 48-subcarrier output
templates:
  imports: |-
    from mywifi.ofdm_decode_signal import ofdm_decode_signal
  make: |-
    ofdm_decode_signal(debug=${debug})
file_format: 1
