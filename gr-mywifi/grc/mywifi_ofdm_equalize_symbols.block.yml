id: mywifi_ofdm_equalize_symbols
label: OFDM Equalize Symbols
category: Mywifi
flags: [python]
parameters:
  - id: debug
    label: Debug print
    dtype: bool
    default: false
inputs:
  - domain: stream
    dtype: complex
    vlen: 1
    id: in
    label: 64-subcarrier symbols (complex)
outputs:
  - domain: stream
    dtype: complex
    vlen: 1
    id: out
    label: 48-subcarrier equalized (complex)
templates:
  imports: |-
    from mywifi.ofdm_equalize_symbols import ofdm_equalize_symbols
  make: |-
    ofdm_equalize_symbols(debug=${debug})
file_format: 1
